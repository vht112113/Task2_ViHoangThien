<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Login - Management System</title>
</head>
<body>
<main class="login-page">
  <div class="login-logo">M</div>
  <h4 class="fw-bold mb-0">Welcome Back!</h4>
  <p class="text-muted small mb-3">Sign in to continue to your account.</p>

  <div class="login-card">
    <h5>Login to your account</h5>
    <p class="text-muted small">Enter your email and password to get started.</p>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <label for="password" class="form-label">Password</label>
          <a href="#" class="link-sm">Forgot password?</a>
        </div>
        <div class="password-wrap">
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required>
          <button type="button" class="toggle-pw" id="togglePw">Show</button>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="remember">
        <label class="form-check-label small" for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn-signin">Sign In</button>
    </form>

    <p class="text-center small text-muted mt-3 mb-0">Don't have an account? <a href="#" class="link-sm">Create an account</a></p>
  </div>
  <p class="small text-muted mt-4">© 2026 My Website. All rights reserved.</p>
</main>

<script src="js/main.js"></script>
</body>
</html>
